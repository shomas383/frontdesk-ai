<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f7a57">
  <meta name="description" content="架空の整体院のAIフロントデスク（デモ）。院の資料をもとに回答します。">
  <title>こもれび整体院 AIフロントデスク</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img class="brand-mark" src="/static/favicon.svg" alt="" width="36" height="36">
        <div>
          <h1 class="title"><span id="clinic-name">こもれび整体院</span> <span class="title-sub">AIフロントデスク</span></h1>
          <p class="subtitle" lang="en">AI front desk demo for a small Japanese clinic</p>
        </div>
      </div>
      <aside class="banner" id="banner" role="note">
        <p class="banner-full">架空の整体院のデモです。AIが院の資料をもとに回答します。個人情報は入力しないでください。</p>
        <p class="banner-short">架空の整体院のデモ・個人情報は入力しないでください</p>
        <a class="banner-link" lang="en" href="https://github.com/shomas383/frontdesk-ai" target="_blank" rel="noopener noreferrer" aria-label="About this demo"><span class="about-long">About this demo</span><span class="about-short">About</span> ↗</a>
      </aside>
    </header>

    <main class="chat" id="chat" aria-live="polite" aria-label="チャット"></main>

    <section class="suggestions" id="suggestions" aria-label="質問の例">
      <p class="suggestions-label">よくある質問から選ぶ</p>
      <div class="chips" id="chips"></div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="input-wrap">
        <label class="visually-hidden" for="message">ご質問</label>
        <textarea id="message" rows="1" placeholder="ご質問を入力してください"></textarea>
        <span class="counter" id="counter" aria-live="polite">0/300</span>
      </div>
      <button class="send" id="send" type="submit" disabled aria-label="送信">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6l-.1 6.5L15 12 3.3 13.9z" fill="currentColor"/></svg>
      </button>
    </form>
  </div>
</body>
</html>
