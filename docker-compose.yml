services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frontdesk
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frontdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
